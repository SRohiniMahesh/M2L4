<!DOCTYPE html>
<html>
<head>
  <title>My Food Menu</title>
  <style>
    body {
      font-family: Arial;
      background: #fff8f0;
      padding: 30px;
      text-align: center;
    }

    h1 { color: #e65c00; }

    /* Sibling Selector - styles the paragraph right after h1 */
    h1 + p {
      background: #ffe0b2;
      padding: 10px 20px;
      border-radius: 8px;
      color: #bf360c;
      display: inline-block;
    }

    ul { padding: 0; margin-top: 20px; }

    /* Child Selector - styles only direct li children of ul */
    ul > li {
      list-style: none;
      font-size: 18px;
      font-weight: bold;
      color: #5d4037;
      padding: 10px 20px;
      margin: 6px auto;
      width: 260px;
      background: #fff3e0;
      border-radius: 8px;
    }

    /* nth-child - highlights the 3rd item as Chef's Special */
    ul li:nth-child(3) {
      background: #ffe082;
      color: #e65c00;
    }

    .desc {
      color: #555;
      margin-top: 20px;
      font-size: 15px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* first-letter - makes the first letter big and bold */
    .desc::first-letter {
      font-size: 220%;
      color: #e65c00;
      font-weight: bold;
    }

    .links { margin-top: 25px; }

    /* Hover Effect - links glow when mouse moves over them */
    a {
      color: #e65c00;
      text-decoration: none;
      font-size: 15px;
      margin: 0 12px;
      padding: 8px 18px;
      border: 2px solid #e65c00;
      border-radius: 8px;
    }

    a:hover {
      background: #e65c00;
      color: white;
    }
    a:active {
            background: #bf360c;
            color: rgb(96, 235, 10);
        }

        /* Disabled Effect */
        a:disabled, a.disabled {
            background: #f5f5f5;
            color: #cccccc;
            border-color: #dcdcdc;
            cursor: not-allowed;
            pointer-events: none;
        }
        .input-group {
      margin-top: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }
        .custom-input {
      width: 100%;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      /* Starts with a semi-transparent opacity */
      opacity: 0.7;
      transition: all 0.3s ease;
    }
        .custom-input:focus {
      outline: none;
      border-color: #2196F3;
      background-color: #e3f2fd;
      /* Becomes fully opaque and solid when active/focused */
      opacity: 1; 
    }
  </style>
</head>
<body>
  <h1>My Food Menu</h1>
  <p>Pick your favourite dish and dig in!</p>

  <ul>
    <li>Pizza</li>
    <li>Burger</li>
    <li>Tacos — Chef's Special!</li>
    <li>Noodles</li>
    <li>Ice Cream</li>
  </ul>

  <p class="desc">Every dish on this menu is made with love and
  loads of flavour. Try them all and find your favourite!</p>

  <div class="links">
    <a href="#">Order Now</a>
    <a href="#" class="disabled">See More</a>
  </div>
  <div class="input-group">
      <label for="username">Username:</label>
      <!-- Input element that uses the :focus pseudo-class -->
      <input type="text" id="username" class="custom-input" placeholder="Type your username here...">
    </div>
</body>
</html>
